name: Calidad documental

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reutilizable desde deploy-pages.yml (ADR-0014): la publicación exige la misma verificación
  # documental que cualquier otro push a main.
  workflow_call:

permissions:
  contents: read

jobs:
  documentos:
    name: Frontmatter, identificadores, enlaces y estado
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar la base documental
        run: python3 scripts/check_docs.py
