<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      CSP por `<meta>` y no por cabecera, con el límite que ADR-0014 declara: GitHub Pages no
      permite cabeceras propias, así que `frame-ancestors`, `report-uri` y `sandbox` **no están
      disponibles**. Lo que sí se puede se aprieta: nada externo, ningún script en línea, y
      `connect-src 'self'` como red de seguridad de la política local-only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#12151a" />
    <title>TAG TRACE — importador</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/presentation/styles.css" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/presentation/main.ts"></script>
  </body>
</html>
